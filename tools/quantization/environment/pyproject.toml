[project]
name = "efficient-sam2-quantization-cpu"
version = "0.1.0"
description = "Isolated CPU reference evaluation and GGUF conversion environment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.5.1+cpu",
  "torchvision==0.20.1+cpu",
  "numpy==2.1.3",
  "pillow==11.0.0",
  "hydra-core==1.3.2",
  "iopath==0.1.10",
  "tqdm==4.67.1",
  "einops==0.8.1",
  "pycocotools==2.0.10",
  "scipy==1.15.3",
  "scikit-image==0.25.2",
  "opencv-python-headless==4.11.0.86",
  "gguf==0.17.1",
  "wandb==0.18.7",
  "pytest==8.4.2",
]

[dependency-groups]
dev = ["black==24.2.0", "usort==1.0.2", "ufmt==2.0.0b2"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
constraint-dependencies = [
  "filelock==3.32.3",
  "fsspec==2026.7.0",
  "markupsafe==3.0.3",
  "networkx==3.6.1",
  "setuptools==78.1.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
